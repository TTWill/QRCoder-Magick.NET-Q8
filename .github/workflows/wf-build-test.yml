name: Build, test (Pull Request)

on:
  pull_request:
    branches:
      - master 

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.dotnet-framework.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-framework:
          - { name: ".NET 8.0 Windows", framework: "net8.0-windows", coverage: true, no-build: false, sdk: "8.0.x" }
          - { name: ".NET 9.0 Windows", framework: "net9.0-windows", coverage: true, no-build: false, sdk: "9.0.x" }
          - { name: ".NET 10.0 Windows", framework: "net10.0-windows", coverage: true, no-build: false, sdk: "10.0.x" }

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install .NET SDK ${{ matrix.dotnet-framework.sdk }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          ${{ matrix.dotnet-framework.sdk }}
          8.0.x
          9.0.x
          10.0.x

    - name: Run tests for ${{ matrix.dotnet-framework.name }}
      working-directory: QRCoderTests
      run: dotnet test -c Debug -f ${{ matrix.dotnet-framework.framework }} --nologo -p:CollectCoverage=${{ matrix.dotnet-framework.coverage }} -p:CoverletOutputFormat=opencover
        
  additional-tests:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    # QRCoderTrimAnalysis multi-targets, and 'dotnet publish' requires an explicit
    # framework when more than one is targeted.
    - name: Run trim analysis
      working-directory: QRCoderTrimAnalysis
      run: dotnet publish -c Release -f net8.0 -o bin/publish/net8.0

    - name: Build solution
      run: dotnet build -c Release

    - name: Run API approval tests
      working-directory: QRCoderApiTests
      run: dotnet test -c Release --nologo
