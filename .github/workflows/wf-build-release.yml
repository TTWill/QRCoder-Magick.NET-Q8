name: Build, pack, push (Release)

on:
  release:
    types:
      - published

jobs:
  pack-push-ci:
    runs-on: windows-latest
    permissions:
      # Required for NuGet.org Trusted Publishing (OIDC). Without this the login step
      # cannot request an identity token and publishing will fail.
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v5
      name: Checkout Code

    - name: Check github.ref starts with 'refs/tags/v'
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      shell: bash
      run: |
        echo Error! github.ref does not start with 'refs/tags/v'
        echo github.ref: ${{ github.ref }}
        exit 1

    - name: Set version number environment variable
      env:
        github_ref: ${{ github.ref }}
      shell: bash
      run: |
        version="${github_ref:11}"
        echo version=$version
        echo "version=$version" >> $GITHUB_ENV

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Build NuGet packages
      shell: bash
      run: dotnet pack -c Release -p:Version=$version -o out

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Nuget packages
        path: out/*

    - name: NuGet.org login (Trusted Publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish packages to NuGet.org
      shell: bash
      # Only the core package is published. QRCoder.Xaml is still packed and attached to the
      # GitHub release, but is intentionally not pushed to NuGet.org.
      run: dotnet nuget push "out/QRCoder-Magick.NET-Q8.*.nupkg" -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload Nuget packages as release artifacts
      uses: actions/github-script@v8
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          console.log('environment', process.versions);
          const fs = require('fs').promises;
          const { repo: { owner, repo }, sha } = context;

          for (let file of await fs.readdir('out')) {
            console.log('uploading', file);

            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: ${{ github.event.release.id }},
              name: file,
              data: await fs.readFile(`out/${file}`)
            });
          }
